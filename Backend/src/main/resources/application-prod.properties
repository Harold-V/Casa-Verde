# Perfil de producción (Docker / instalación local definitiva)
# Activar: spring.profiles.active=prod  (o SPRING_PROFILES_ACTIVE=prod en Docker)

# Sin SQL en consola en producción
spring.jpa.show-sql=false

# En producción Flyway gestiona el esquema; Hibernate solo valida que coincida.
# Nunca usar 'update' en producción — puede modificar el esquema de forma no controlada.
spring.jpa.hibernate.ddl-auto=validate

# Logs reducidos en producción
logging.level.root=WARN
logging.level.com.casaverde=INFO

# Directorio de backups apunta al volumen montado en Docker
app.backup.dir=/app/Backups
