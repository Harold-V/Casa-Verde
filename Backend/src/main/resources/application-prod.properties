# Perfil de produccion (Docker / instalacion local definitiva).
# Activar: spring.profiles.active=prod o SPRING_PROFILES_ACTIVE=prod en Docker.

# Sin SQL en consola en produccion.
spring.jpa.show-sql=false

# En produccion Flyway gestiona el esquema; Hibernate valida que coincida.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Seguridad API. Sobrescribir APP_SECURITY_TOKEN_SECRET en instalacion real.
app.security.enabled=true

# Logs reducidos en produccion.
logging.level.root=WARN
logging.level.com.casaverde=INFO

# Directorio de backups apunta al volumen montado en Docker.
app.backup.dir=/app/Backups
