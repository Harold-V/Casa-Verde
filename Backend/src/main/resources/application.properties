app.datasource.path=./DataBase/casaverde.db
cors.allowed-origins=http://localhost:5173,http://localhost,http://localhost:80,null,file://
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.backup.dir=./Backups
app.admin.default-password=admin123
app.security.enabled=false
app.security.token-secret=${APP_SECURITY_TOKEN_SECRET:casaverde-local-dev-secret-change-in-prod}
app.security.token-expiration-hours=12
spring.jpa.database-platform=com.casaverde.backend.config.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
server.port=5020
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Flyway - migraciones versionadas. Hibernate valida el esquema.
# baseline-on-migrate permite adoptar una BD local existente sin historial Flyway.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
