app.datasource.path=./DataBase/casaverde.db
cors.allowed-origins=http://localhost:5173,http://localhost,http://localhost:80,null,file://
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.backup.dir=./Backups
app.admin.default-password=admin123
spring.jpa.database-platform=com.casaverde.backend.config.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
server.port=5020
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway — migraciones versionadas
# baseline-on-migrate: en BD existente (sin flyway_schema_history) marca la versión actual como V1 sin re-ejecutarla
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
