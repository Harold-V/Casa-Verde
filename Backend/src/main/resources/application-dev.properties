# Perfil de desarrollo local
# Activar: spring.profiles.active=dev  (o SPRING_PROFILES_ACTIVE=dev en Docker)

# SQL visible en consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs más verbosos en desarrollo
logging.level.root=INFO
logging.level.com.casaverde=DEBUG
logging.level.org.springframework.web=DEBUG
