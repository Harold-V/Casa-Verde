services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: casaverde-backend
    ports:
      - "5020:5020"
    volumes:
      - casaverde_db:/app/DataBase
    environment:
      - TZ=America/Bogota
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5020/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: casaverde-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:5020
    restart: unless-stopped

volumes:
  casaverde_db:
    driver: local
